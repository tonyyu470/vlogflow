name: Tests and package
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: python -m pip install -e '.[dev,asr]'
      - run: pytest
      - run: node --test tests/frontend.test.cjs
      - run: ruff check src tests --select F,I
      - run: python -m build
      - name: Install built wheel in a clean environment
        run: |
          python -m venv /tmp/vlogflow-smoke
          /tmp/vlogflow-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/vlogflow-smoke/bin/vlogflow doctor
          /tmp/vlogflow-smoke/bin/python -c "from importlib.resources import files; assert files('vlogflow').joinpath('static/index.html').is_file(); assert files('vlogflow').joinpath('assets/NotoSansSC.ttf').is_file()"
